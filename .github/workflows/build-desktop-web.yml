name: Build desktop and web ports

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .flutter-version
      - run: flutter pub get
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: absorb-web
          path: build/web

  linux:
    # desktop_webview_window currently requires WebKitGTK 4.0, which is
    # available on Ubuntu 22.04 but not the current Ubuntu 24.04 runner.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libwebkit2gtk-4.0-dev libsoup-3.0-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .flutter-version
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - name: Patch desktop_webview_window for current GLib API
        run: |
          sed -i 's/g_date_time_get_seconds/g_date_time_to_unix/g' \
            linux/flutter/ephemeral/.plugin_symlinks/desktop_webview_window/linux/webview_window.cc
      - run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: absorb-linux
          path: build/linux/x64/release/bundle
