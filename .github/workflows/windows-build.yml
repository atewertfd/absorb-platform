name: Windows Desktop Build

# Builds the Windows desktop app from whichever branch the run is started on
# and uploads the runner folder as a workflow artifact. Nothing is signed and
# nothing goes to a release: download the zip from the run page, unpack it
# anywhere and start absorb.exe.

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Windows app
    # windows-latest is the VS 2026 image, whose STL turns the deprecated
    # <experimental/coroutine> include in flutter_inappwebview_windows and
    # permission_handler_windows into a hard error. VS 2022 only warns.
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - name: Read version
        id: version
        shell: bash
        run: |
          full=$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//' | tr -d '\r')
          echo "name=absorb-${full/+/-}-windows" >> "$GITHUB_OUTPUT"

      - name: Build
        run: flutter build windows --release

      # The runner folder needs the VC++ runtime next to the exe on machines
      # that never installed the redistributable.
      - name: Add the VC++ runtime DLLs
        shell: pwsh
        run: |
          $out = "build\windows\x64\runner\Release"
          $crt = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\*\VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT" -Directory -ErrorAction SilentlyContinue | Select-Object -Last 1
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            $src = if ($crt) { Join-Path $crt.FullName $dll } else { "C:\Windows\System32\$dll" }
            if (-not (Test-Path $src)) { $src = "C:\Windows\System32\$dll" }
            Copy-Item $src $out
          }
          Get-ChildItem $out | Select-Object Name, Length

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build Windows installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.name }}
        run: |
          $rawVersion = (Select-String -Path pubspec.yaml -Pattern '^version:' | ForEach-Object { $_.Line.Split(':', 2)[1].Trim() })
          $installerVersion = ($rawVersion -split '\+')[0]
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found at $iscc" }
          & $iscc `
            "/DAppVersion=$installerVersion" `
            "/DSourceDir=$((Resolve-Path 'build\windows\x64\runner\Release').Path)" `
            "installer\Absorb.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          Get-ChildItem build\windows\installer

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.name }}
          path: build/windows/x64/runner/Release
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.name }}-installer
          path: build/windows/installer/*.exe
          if-no-files-found: error
          retention-days: 14
