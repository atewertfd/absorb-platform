name: Windows Beta Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      prerelease:
        description: Publish as a GitHub pre-release
        required: false
        type: boolean
        default: true
      release_notes:
        description: Optional release notes shown on GitHub
        required: false
        type: string
        default: "Windows installer and portable build for testing."
      beta_number:
        description: Beta number shown in the release notes (blank uses kBetaNumber from lib/build_info.dart)
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build and publish Windows beta
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $raw = (Select-String -Path pubspec.yaml -Pattern '^version:' | ForEach-Object { $_.Line.Split(':', 2)[1].Trim() })
          $parts = $raw -split '\+'
          $version = $parts[0]
          $build = $parts[1]
          $event = '${{ github.event_name }}'
          $inputPre = '${{ inputs.prerelease }}'
          $pre = if ($event -eq 'push') { $true } else { $inputPre -eq 'true' }
          $tag = if ($event -eq 'push') { '${{ github.ref_name }}' } elseif ($pre) { "v$version-$build" } else { "v$version" }
          "raw=$raw" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "build=$build" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "pre=$pre" >> $env:GITHUB_OUTPUT

      - name: Build Windows app
        run: flutter build windows --release --dart-define=GITHUB_BUILD=true

      - name: Add the VC++ runtime DLLs
        shell: pwsh
        run: |
          $out = 'build\windows\x64\runner\Release'
          $crt = Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\2022\*\VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT' -Directory -ErrorAction SilentlyContinue | Select-Object -Last 1
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            $src = if ($crt) { Join-Path $crt.FullName $dll } else { "C:\Windows\System32\$dll" }
            if (-not (Test-Path $src)) { $src = "C:\Windows\System32\$dll" }
            Copy-Item $src $out -Force
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found at $iscc" }
          & $iscc `
            "/DAppVersion=$env:APP_VERSION" `
            "/DSourceDir=$((Resolve-Path 'build\windows\x64\runner\Release').Path)" `
            'installer\Absorb.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Build portable ZIP
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          $portableRoot = Join-Path $env:RUNNER_TEMP 'absorb-portable'
          New-Item -ItemType Directory -Path $portableRoot -Force | Out-Null
          Copy-Item 'build\windows\x64\runner\Release\*' $portableRoot -Recurse -Force
          $zip = "build\windows\installer\Absorb-$env:VERSION-$env:BUILD-windows-portable.zip"
          Compress-Archive -Path (Join-Path $portableRoot '*') -DestinationPath $zip -CompressionLevel Optimal

      - name: Publish GitHub pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
          PRE: ${{ steps.version.outputs.pre }}
          BETA_NUMBER: ${{ inputs.beta_number }}
          NOTES: ${{ inputs.release_notes }}
        run: |
          $installer = Get-ChildItem 'build\windows\installer\Absorb-*-Setup.exe' | Select-Object -First 1
          $portable = Get-ChildItem 'build\windows\installer\*-windows-portable.zip' | Select-Object -First 1
          if (-not $installer -or -not $portable) { throw 'Windows release assets were not produced.' }
          $beta = $env:BETA_NUMBER
          if ([string]::IsNullOrWhiteSpace($beta)) {
            # Match the "Beta N" the app itself shows.
            $match = Select-String -Path 'lib\build_info.dart' -Pattern '^const int kBetaNumber = (\d+);' | Select-Object -First 1
            $beta = if ($match) { $match.Matches[0].Groups[1].Value } else { $env:BUILD }
          }
          $notes = $env:NOTES
          if ([string]::IsNullOrWhiteSpace($notes)) { $notes = 'Windows installer and portable build for testing.' }
          $title = "Absorb Plus $env:VERSION-$env:BUILD (Beta $beta)"
          $notesFile = Join-Path $env:RUNNER_TEMP 'absorb-release-notes.md'
          @("## Beta $beta", '', $notes, '', 'The Windows installer updates an existing Absorb Plus installation in place and preserves its user data.') | Set-Content -Path $notesFile -Encoding utf8
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            if ($env:PRE -eq 'true') {
              gh release edit $env:TAG --repo $env:GITHUB_REPOSITORY --title $title --notes-file $notesFile --prerelease
            } else {
              gh release edit $env:TAG --repo $env:GITHUB_REPOSITORY --title $title --notes-file $notesFile --latest
            }
            gh release upload $env:TAG $installer.FullName $portable.FullName --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            $args = @('release', 'create', $env:TAG, $installer.FullName, $portable.FullName, '--repo', $env:GITHUB_REPOSITORY, '--title', $title, '--notes-file', $notesFile)
            if ($env:PRE -eq 'true') { $args += '--prerelease' }
            & gh @args
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
          }
          $assetNames = @(gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name')
          if ($assetNames -notcontains $installer.Name) {
            throw "Installer asset was not published: $($installer.Name)"
          }
          if ($assetNames -notcontains $portable.Name) {
            throw "Portable asset was not published: $($portable.Name)"
          }
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY
