name: Desktop and Web Release

# Builds the non-Apple release files and attaches them to one GitHub release.
# Push a v* tag for automatic publishing, or run this workflow manually with a
# tag such as v1.11.1-288. Apple jobs are intentionally not part of this file.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.11.1-288'
        required: true
        type: string
      prerelease:
        description: 'Mark the GitHub release as a prerelease'
        required: false
        default: true
        type: boolean

concurrency:
  # Prevent two builds for the same tag from racing while uploading assets.
  group: absorb-release-${{ github.ref }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      name: ${{ steps.version.outputs.name }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve release identity
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            TAG="$GITHUB_REF_NAME"
            PRE=true
          else
            TAG="$INPUT_TAG"
            PRE="$INPUT_PRERELEASE"
          fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "Invalid release tag: $TAG"
            exit 1
          }
          RAW=$(grep '^version:' pubspec.yaml | sed 's/version: *//')
          BASE="absorb-${RAW//+/-}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$BASE" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          PRE: ${{ steps.version.outputs.prerelease }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Using existing release $TAG"
          else
            args=(--title "$TAG" --generate-notes)
            [ "$PRE" = true ] && args+=(--prerelease)
            gh release create "$TAG" "${args[@]}"

  quality:
    name: Analyze and test before release
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .flutter-version
          cache: true
      - run: flutter pub get
      - name: Analyze Dart and Flutter code
        run: flutter analyze --no-pub --no-fatal-infos
      - name: Run automated tests
        run: flutter test --no-pub --reporter expanded
          fi

  windows:
    name: Windows installer and portable
    needs: [prepare, quality]
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .flutter-version
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release --no-pub
      - name: Add VC++ runtime
        shell: pwsh
        run: |
          $out = 'build\windows\x64\runner\Release'
          $crt = Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\2022\*\VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT' -Directory -ErrorAction SilentlyContinue | Select-Object -Last 1
          foreach ($dll in 'msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll') {
            $src = if ($crt) { Join-Path $crt.FullName $dll } else { "C:\Windows\System32\$dll" }
            if (-not (Test-Path $src)) { throw "Missing VC++ runtime: $dll" }
            Copy-Item $src $out -Force
          }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes
      - name: Package Windows files
        shell: pwsh
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          NAME: ${{ needs.prepare.outputs.name }}
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found" }
          $raw = (Select-String -Path pubspec.yaml -Pattern '^version:' | ForEach-Object { $_.Line.Split(':', 2)[1].Trim() })
          $version = ($raw -split '\+')[0]
          & $iscc "/DAppVersion=$version" "/DSourceDir=$((Resolve-Path 'build\windows\x64\runner\Release').Path)" 'installer\Absorb.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
          New-Item -ItemType Directory -Force build\windows\release | Out-Null
          Compress-Archive -Path 'build\windows\x64\runner\Release\*' -DestinationPath "build\windows\release\$env:NAME-windows-portable.zip" -Force
          Copy-Item 'build\windows\installer\*.exe' build\windows\release
          Get-ChildItem build\windows\release | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $($_.Name)" } | Set-Content "build\windows\release\$env:NAME-windows-SHA256SUMS.txt"
      - name: Upload Windows files
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload $env:TAG build\windows\release\* --clobber

  windows-arm64:
    name: Windows ARM64 portable
    needs: prepare
    # ARM64 Flutter support is useful but currently depends on preview runner
    # images and a special SDK bootstrap. It must not block stable releases.
    continue-on-error: true
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        id: flutter_arm
        with:
          channel: stable
          flutter-version-file: .flutter-version
          # Use the x64 host SDK, then refresh its Dart/Windows ARM64 engine.
          architecture: x64
          cache: true
      - name: Switch Flutter SDK to Windows ARM64 engine
        shell: pwsh
        run: |
          $flutterRoot = '${{ steps.flutter_arm.outputs.CACHE-PATH }}'
          if (-not (Test-Path "$flutterRoot\bin\internal\update_dart_sdk.ps1")) {
            throw "Flutter SDK internals not found at $flutterRoot"
          }
          Remove-Item "$flutterRoot\bin\cache\engine-dart-sdk.stamp" -Force -ErrorAction SilentlyContinue
          & "$flutterRoot\bin\internal\update_dart_sdk.ps1"
          $dartVersion = (& "$flutterRoot\bin\dart.bat" --version 2>&1 | Out-String)
          Write-Host $dartVersion
          if ($dartVersion -notmatch 'windows_arm64') {
            throw "Expected Windows ARM64 Dart SDK, received: $dartVersion"
          }
          & "$flutterRoot\bin\flutter.bat" precache --windows
      - run: flutter pub get
      - run: flutter build windows --release --no-pub
      - name: Add ARM64 VC++ runtime
        shell: pwsh
        run: |
          $out = 'build\windows\arm64\runner\Release'
          $crt = Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\2022\*\VC\Redist\MSVC\*\arm64\Microsoft.VC143.CRT' -Directory -ErrorAction SilentlyContinue | Select-Object -Last 1
          foreach ($dll in 'msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll') {
            $src = if ($crt) { Join-Path $crt.FullName $dll } else { "C:\Windows\System32\$dll" }
            if (-not (Test-Path $src)) { throw "Missing ARM64 VC++ runtime: $dll" }
            Copy-Item $src $out -Force
          }
      - name: Package Windows ARM64 portable
        shell: pwsh
        env:
          NAME: ${{ needs.prepare.outputs.name }}
        run: |
          New-Item -ItemType Directory -Force build\windows\arm64\release | Out-Null
          Compress-Archive -Path 'build\windows\arm64\runner\Release\*' -DestinationPath "build\windows\arm64\release\$env:NAME-windows-arm64-portable.zip" -Force
          Get-ChildItem build\windows\arm64\release | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $($_.Name)" } | Set-Content "build\windows\arm64\release\$env:NAME-windows-arm64-SHA256SUMS.txt"
      - name: Upload Windows ARM64 files
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload $env:TAG build\windows\arm64\release\* --clobber

  linux:
    name: Linux tarball and Debian package
    needs: [prepare, quality]
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libwebkit2gtk-4.0-dev libsoup-3.0-dev libmpv-dev dpkg-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .flutter-version
          cache: true
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - name: Patch desktop webview compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('linux/flutter/ephemeral/.plugin_symlinks/desktop_webview_window/linux/webview_window.cc')
          source = path.read_text()
          old = '    gdouble expires = g_date_time_get_seconds(soup_cookie_get_expires(cookie));'
          new = ("    SoupDate *expires_date = soup_cookie_get_expires(cookie);\n"
                 "    gdouble expires = expires_date == nullptr\n"
                 "                           ? -1\n"
                 "                           : static_cast<gdouble>(soup_date_to_time_t(expires_date));")
          if old in source:
              path.write_text(source.replace(old, new, 1))
          elif 'SoupDate *expires_date = soup_cookie_get_expires(cookie);' in source:
              print('desktop_webview_window cookie expiry patch already present')
          else:
              raise SystemExit('desktop_webview_window cookie expiry source changed; review required')
          PY
      - run: flutter build linux --release --no-pub
      - name: Package Linux files
        env:
          NAME: ${{ needs.prepare.outputs.name }}
        run: |
          mkdir -p build/linux/release build/linux/deb/DEBIAN build/linux/deb/opt/absorb-plus build/linux/deb/usr/share/applications
          cp -a build/linux/x64/release/bundle/. build/linux/deb/opt/absorb-plus/
          cat > build/linux/deb/DEBIAN/control <<EOF
          Package: absorb-plus
          Version: ${NAME#absorb-}
          Section: sound
          Priority: optional
          Architecture: amd64
          Maintainer: Absorb Plus contributors
          Description: Cross-platform Audiobookshelf client
          EOF
          cat > build/linux/deb/usr/share/applications/absorb-plus.desktop <<'EOF'
          [Desktop Entry]
          Name=Absorb Plus
          Comment=Audiobookshelf client
          Exec=/opt/absorb-plus/absorb
          Icon=/opt/absorb-plus/data/flutter_assets/assets/icon/app_icon.png
          Terminal=false
          Type=Application
          Categories=AudioVideo;Audio;Player;
          EOF
          tar -C build/linux/x64/release -czf "build/linux/release/$NAME-linux-x64.tar.gz" bundle
          dpkg-deb --build --root-owner-group build/linux/deb "build/linux/release/$NAME-linux-amd64.deb"
          sha256sum build/linux/release/* > "build/linux/release/$NAME-linux-SHA256SUMS.txt"
      - name: Upload Linux files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" build/linux/release/* --clobber

  linux-arm64:
    name: Linux ARM64 tarball and Debian package
    needs: prepare
    # Keep this experimental until an official ARM64 Linux Flutter SDK is
    # available on the hosted runner image.
    continue-on-error: true
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libwebkit2gtk-4.0-dev libsoup-3.0-dev libmpv-dev dpkg-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .flutter-version
          cache: true
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - name: Patch desktop webview compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('linux/flutter/ephemeral/.plugin_symlinks/desktop_webview_window/linux/webview_window.cc')
          source = path.read_text()
          old = '    gdouble expires = g_date_time_get_seconds(soup_cookie_get_expires(cookie));'
          new = ("    SoupDate *expires_date = soup_cookie_get_expires(cookie);\n"
                 "    gdouble expires = expires_date == nullptr\n"
                 "                           ? -1\n"
                 "                           : static_cast<gdouble>(soup_date_to_time_t(expires_date));")
          if old in source:
              path.write_text(source.replace(old, new, 1))
          elif 'SoupDate *expires_date = soup_cookie_get_expires(cookie);' in source:
              print('desktop_webview_window cookie expiry patch already present')
          else:
              raise SystemExit('desktop_webview_window cookie expiry source changed; review required')
          PY
      - run: flutter build linux --release --no-pub
      - name: Package Linux ARM64 files
        env:
          NAME: ${{ needs.prepare.outputs.name }}
        run: |
          mkdir -p build/linux/arm64/release build/linux/deb/DEBIAN build/linux/deb/opt/absorb-plus build/linux/deb/usr/share/applications
          cp -a build/linux/arm64/release/bundle/. build/linux/deb/opt/absorb-plus/
          cat > build/linux/deb/DEBIAN/control <<EOF
          Package: absorb-plus
          Version: ${NAME#absorb-}
          Section: sound
          Priority: optional
          Architecture: arm64
          Maintainer: Absorb Plus contributors
          Description: Cross-platform Audiobookshelf client
          EOF
          cat > build/linux/deb/usr/share/applications/absorb-plus.desktop <<'EOF'
          [Desktop Entry]
          Name=Absorb Plus
          Comment=Audiobookshelf client
          Exec=/opt/absorb-plus/absorb
          Icon=/opt/absorb-plus/data/flutter_assets/assets/icon/app_icon.png
          Terminal=false
          Type=Application
          Categories=AudioVideo;Audio;Player;
          EOF
          tar -C build/linux/arm64/release -czf "build/linux/arm64/release/$NAME-linux-arm64.tar.gz" bundle
          dpkg-deb --build --root-owner-group build/linux/deb "build/linux/arm64/release/$NAME-linux-arm64.deb"
          sha256sum build/linux/arm64/release/* > "build/linux/arm64/release/$NAME-linux-arm64-SHA256SUMS.txt"
      - name: Upload Linux ARM64 files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" build/linux/arm64/release/* --clobber

  web:
    name: Web ZIP
    needs: [prepare, quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .flutter-version
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --no-pub
      - name: Package web files
        env:
          NAME: ${{ needs.prepare.outputs.name }}
        run: |
          mkdir -p build/web/release
          cd build/web
          zip -r "release/$NAME-web.zip" . -x 'release/*'
          cd release
          sha256sum * > "$NAME-web-SHA256SUMS.txt"
      - name: Upload web files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" build/web/release/* --clobber

  android:
    name: Android APK and optional Play Store bundle
    needs: [prepare, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .flutter-version
          cache: true
      - run: flutter pub get
      - name: Configure Android signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/absorb-upload-key.jks"
          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${STORE_PASSWORD:-}" ] && [ -n "${KEY_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KEYSTORE"
            echo "playstore_signing=true" >> "$GITHUB_ENV"
          else
            echo "Android signing secrets are not configured; using a temporary CI key for installable APKs."
            keytool -genkeypair -v -keystore "$KEYSTORE" -storepass android -keypass android \
              -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Absorb CI, OU=Build, O=Absorb, C=US"
            STORE_PASSWORD=android
            KEY_PASSWORD=android
            KEY_ALIAS=upload
            echo "playstore_signing=false" >> "$GITHUB_ENV"
          fi
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$KEYSTORE
          EOF
      - name: Build Android APKs
        run: bash scripts/build-github-apks
      - name: Build Play Store AAB when signing is configured
        if: env.playstore_signing == 'true'
        run: flutter build appbundle --release --flavor playstore --dart-define=PLAYSTORE_BUILD=true
      - name: Package Android files
        env:
          NAME: ${{ needs.prepare.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/android/release
          shopt -s nullglob
          apks=(build/app/outputs/apk/github/release/*.apk)
          [ "${#apks[@]}" -gt 0 ] || { echo 'No Android APKs were produced'; exit 1; }
          suffix=""
          [ "${playstore_signing:-false}" = true ] || suffix="-ci"
          for apk in "${apks[@]}"; do
            kind=$(basename "$apk" | sed -E 's/.*-((universal|armeabi-v7a|arm64-v8a|x86_64))\.apk$/\1/')
            cp "$apk" "build/android/release/$NAME-android-$kind$suffix.apk"
          done
          if [ "${playstore_signing:-false}" = true ]; then
            aab=(build/app/outputs/bundle/playstoreRelease/*.aab)
            [ "${#aab[@]}" -eq 1 ] || { echo 'Play Store AAB was not produced'; exit 1; }
            cp "${aab[0]}" "build/android/release/$NAME-android-playstore.aab"
          fi
          sha256sum build/android/release/* > "build/android/release/$NAME-android-SHA256SUMS.txt"
      - name: Upload Android files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" build/android/release/* --clobber
