name: Checks

# The one place that defines "the code is OK": analyze, Flutter tests, the
# tooling tests, the removed-paths check and the fork-only lints. Called by
# ci.yml and release.yml.

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check (empty = the triggering ref)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  checks:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .flutter-version
          cache: true
      # The UI overflow sweep measures text with Roboto from
      # bin/cache/artifacts/material_fonts, which a fresh runner doesn't have
      # (the test then skips). Only the platform-neutral artifacts are needed.
      - name: Download Flutter's material fonts
        run: flutter precache --universal --no-android --no-ios --no-linux --no-windows --no-macos --no-web
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-infos
      - name: Flutter tests
        run: flutter test --no-pub
      - name: Tooling tests (hooks, merge tool)
        run: python3 -m unittest discover -s tool/tests
      - name: Removed paths stay removed
        run: python3 tool/check_fork_removed.py
      - name: Fork-only lints (use_build_context_synchronously in fork-added files)
        run: python3 tool/fork_lints.py
