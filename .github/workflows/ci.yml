name: CI

# Every push and pull request: checks. On main, pull requests and manual runs:
# also the web and Linux builds. On pushes to main: deploy the web build to GitHub Pages.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/_checks.yml

  web:
    name: Web build
    needs: checks
    if: github.ref == 'refs/heads/main' || github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .flutter-version
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --no-pub --base-href /absorb-platform/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  linux:
    name: Linux build
    needs: checks
    if: github.ref == 'refs/heads/main' || github.event_name != 'push'
    # desktop_webview_window needs WebKitGTK 4.0, available on 22.04 only.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libmpv-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .flutter-version
          cache: true
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: python3 tool/ci/patch_webview_linux.py
      - run: flutter build linux --release --no-pub
      - uses: actions/upload-artifact@v4
        with:
          name: absorb-linux
          path: build/linux/x64/release/bundle

  deploy-pages:
    name: Deploy web to GitHub Pages
    needs: web
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
