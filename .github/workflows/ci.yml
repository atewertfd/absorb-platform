name: CI

# Every push and pull request: checks. On main, pull requests and manual runs:
# also the web and Linux builds. On pushes to main: deploy the web build to GitHub Pages.
# Manual runs only (dev.ps1 apk): the signed phone-test APK. Phone APKs are
# batched, and releases build their own, so pushes don't pay ~10 minutes each.
# Pushes and pull requests that change only docs, top-level Markdown or the
# Claude Code config skip CI entirely (nothing in them reaches a build).

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.claude/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.claude/**'
  workflow_dispatch:

concurrency:
  # Per event too: a push must not cancel a manual run (the phone-test APK).
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/_checks.yml

  web:
    name: Web build
    needs: checks
    if: github.ref == 'refs/heads/main' || github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .flutter-version
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --no-pub --base-href /absorb-platform/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  linux:
    name: Linux build
    needs: checks
    if: github.ref == 'refs/heads/main' || github.event_name != 'push'
    # desktop_webview_window needs WebKitGTK 4.0, available on 22.04 only.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libmpv-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .flutter-version
          cache: true
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: python3 tool/ci/patch_webview_linux.py
      - run: flutter build linux --release --no-pub
      - uses: actions/upload-artifact@v4
        with:
          name: absorb-linux
          path: build/linux/x64/release/bundle

  android:
    name: Android APK (signed, for phone testing)
    # Manual runs only (dev.ps1 apk, or gh workflow run ci.yml --ref <branch>).
    # Runs alongside checks to save time: an APK from a run whose checks
    # failed is never handed out for testing (the run shows red).
    # Needs the signing secrets, which pull requests don't get.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # Keeps Gradle's dependency and build caches between runs, saved from
      # this branch too (the default saves only on main), so unchanged plugin
      # code isn't recompiled for every phone-test APK.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      # Gradle otherwise downloads two NDKs, CMake and an SDK platform on every
      # run (about 5 minutes). Same key as release.yml, so tag builds reuse it.
      - name: Cache Android NDK, CMake and SDK platform
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/27.0.12077973
            /usr/local/lib/android/sdk/ndk/28.*
            /usr/local/lib/android/sdk/cmake/3.22.1
            /usr/local/lib/android/sdk/platforms/android-33
          key: android-sdk-${{ hashFiles('.flutter-version', 'android/app/build.gradle.kts', 'packages/whisper_ggml_plus/android/build.gradle') }}
      # Reuses compiled Whisper C++ objects between runs (CMake picks up the
      # *_COMPILER_LAUNCHER variables set on the build step).
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-ccache-arm64
          max-size: 1G
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .flutter-version
          cache: true
      - run: flutter pub get
      - name: Configure Android signing (permanent key)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${KEYSTORE_B64:-}" ] || { echo "Android signing secrets are missing"; exit 1; }
          KEYSTORE="$RUNNER_TEMP/absorb-upload-key.jks"
          echo "$KEYSTORE_B64" | base64 -d > "$KEYSTORE"
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$KEYSTORE
          EOF
      # 64-bit ARM only (every modern phone): about a third of the compile time.
      # Releases still ship every ABI.
      - name: Build arm64 APK
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          # Gradle's build cache: reuse task outputs whose inputs didn't change.
          GRADLE_OPTS: -Dorg.gradle.caching=true
        run: flutter build apk --release --no-pub --flavor github --target-platform android-arm64 --dart-define=GITHUB_BUILD=true
      - name: Verify the APK carries the permanent signing key
        run: python3 tool/ci/verify_apk_signature.py build/app/outputs/flutter-apk/*github-release*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: absorb-android-apk
          path: build/app/outputs/flutter-apk/*github-release*.apk
          retention-days: 14

  deploy-pages:
    name: Deploy web to GitHub Pages
    needs: web
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
