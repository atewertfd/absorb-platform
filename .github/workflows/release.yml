name: Release

# Push a tag vX.Y.Z-N matching pubspec.yaml (X.Y.Z+N) to publish Absorb Plus:
# Windows installer + portable ZIP, Linux tar.gz + .deb, web ZIP, Android APKs.
# Odd patch = beta (pre-release); even patch = stable. One workflow creates and
# fills one release, so jobs never race each other. No checksum files (owner's
# preference). Release notes are replaced afterwards by the /release skill.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v1.12.1-305
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      name: ${{ steps.v.outputs.name }}
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Resolve version and create the release
        id: v
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          RAW=$(grep '^version:' pubspec.yaml | sed 's/version: *//')
          VERSION="${RAW%%+*}"
          BUILD="${RAW##*+}"
          if [ "$TAG" != "v$VERSION-$BUILD" ]; then
            echo "Tag $TAG doesn't match pubspec.yaml ($RAW -> v$VERSION-$BUILD)"; exit 1
          fi
          BETA=$(sed -n 's/^const int kBetaNumber = \([0-9]*\);.*/\1/p' lib/build_info.dart)
          PATCH="${VERSION##*.}"
          if [ $((PATCH % 2)) -eq 1 ]; then
            TITLE="Absorb Plus $VERSION-$BUILD (Beta $BETA)"
            NOTES="## Beta $BETA"$'\n\n'"Release notes follow once all builds are attached."
            FLAGS=(--prerelease)
          else
            TITLE="Absorb Plus $VERSION"
            NOTES="Release notes follow once all builds are attached."
            FLAGS=()
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE"
          else
            gh release create "$TAG" --verify-tag --title "$TITLE" --notes "$NOTES" "${FLAGS[@]}"
          fi
          {
            echo "tag=$TAG"
            echo "name=absorb-$VERSION-$BUILD"
            echo "version=$VERSION"
            echo "build=$BUILD"
          } >> "$GITHUB_OUTPUT"

  checks:
    needs: prepare
    uses: ./.github/workflows/_checks.yml
    with:
      ref: ${{ needs.prepare.outputs.tag }}

  windows:
    name: Windows installer and portable ZIP
    needs: [prepare, checks]
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .flutter-version
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release --no-pub --dart-define=GITHUB_BUILD=true
      - name: Add the VC++ runtime DLLs
        shell: pwsh
        run: |
          $out = 'build\windows\x64\runner\Release'
          $crt = Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\2022\*\VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT' -Directory -ErrorAction SilentlyContinue | Select-Object -Last 1
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            $src = if ($crt) { Join-Path $crt.FullName $dll } else { "C:\Windows\System32\$dll" }
            if (-not (Test-Path $src)) { $src = "C:\Windows\System32\$dll" }
            Copy-Item $src $out -Force
          }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes
      - name: Build installer and portable ZIP
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD: ${{ needs.prepare.outputs.build }}
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found at $iscc" }
          $release = (Resolve-Path 'build\windows\x64\runner\Release').Path
          & $iscc "/DAppVersion=$env:VERSION" "/DSourceDir=$release" 'installer\Absorb.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          Compress-Archive -Path "$release\*" -DestinationPath "build\windows\installer\Absorb-$env:VERSION-$env:BUILD-windows-portable.zip" -CompressionLevel Optimal
      - name: Upload Windows files
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          $files = @(Get-ChildItem 'build\windows\installer\Absorb-*-Setup.exe') + @(Get-ChildItem 'build\windows\installer\*-windows-portable.zip')
          if ($files.Count -ne 2) { throw "Expected installer + portable ZIP, found $($files.Count) file(s)" }
          gh release upload $env:TAG $files.FullName --clobber
          if ($LASTEXITCODE -ne 0) { throw 'upload failed' }

  linux:
    name: Linux tarball and Debian package
    needs: [prepare, checks]
    # desktop_webview_window needs WebKitGTK 4.0, available on 22.04 only.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libmpv-dev dpkg-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .flutter-version
          cache: true
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: python3 tool/ci/patch_webview_linux.py
      - run: flutter build linux --release --no-pub
      - name: Package Linux files
        env:
          NAME: ${{ needs.prepare.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p build/linux/release build/linux/deb/DEBIAN build/linux/deb/opt/absorb-plus build/linux/deb/usr/share/applications
          cp -a build/linux/x64/release/bundle/. build/linux/deb/opt/absorb-plus/
          cat > build/linux/deb/DEBIAN/control <<EOF
          Package: absorb-plus
          Version: ${NAME#absorb-}
          Section: sound
          Priority: optional
          Architecture: amd64
          Maintainer: Absorb Plus contributors
          Description: Cross-platform Audiobookshelf client
          EOF
          cat > build/linux/deb/usr/share/applications/absorb-plus.desktop <<'EOF'
          [Desktop Entry]
          Name=Absorb Plus
          Comment=Audiobookshelf client
          Exec=/opt/absorb-plus/absorb
          Icon=/opt/absorb-plus/data/flutter_assets/assets/icon/app_icon.png
          Terminal=false
          Type=Application
          Categories=AudioVideo;Audio;Player;
          EOF
          tar -C build/linux/x64/release -czf "build/linux/release/$NAME-linux-x64.tar.gz" bundle
          dpkg-deb --build --root-owner-group build/linux/deb "build/linux/release/$NAME-linux-amd64.deb"
      - name: Upload Linux files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" build/linux/release/* --clobber

  web:
    name: Web ZIP
    needs: [prepare, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .flutter-version
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --no-pub
      - name: Package and upload web files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAME: ${{ needs.prepare.outputs.name }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          (cd build/web && zip -qr "../$NAME-web.zip" .)
          gh release upload "$TAG" "build/$NAME-web.zip" --clobber

  android:
    name: Android APKs (signed with the permanent key)
    needs: [prepare, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      # Same cache as ci.yml (NDKs, CMake, SDK platform; about 5 minutes saved).
      - name: Cache Android NDK, CMake and SDK platform
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/27.0.12077973
            /usr/local/lib/android/sdk/ndk/28.*
            /usr/local/lib/android/sdk/cmake/3.22.1
            /usr/local/lib/android/sdk/platforms/android-33
          key: android-sdk-${{ hashFiles('.flutter-version', 'android/app/build.gradle.kts', 'packages/whisper_ggml_plus/android/build.gradle') }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .flutter-version
          cache: true
      - run: flutter pub get
      - name: Configure Android signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          # Releases must be signed with the permanent key, or phones can't
          # update over the previous version. Never fall back to a temp key.
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ] || [ -z "${STORE_PASSWORD:-}" ] || [ -z "${KEY_PASSWORD:-}" ] || [ -z "${KEY_ALIAS:-}" ]; then
            echo "Android signing secrets (ANDROID_KEYSTORE_*) are missing; refusing to release unsigned-for-updates APKs."
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/absorb-upload-key.jks"
          echo "$KEYSTORE_B64" | base64 -d > "$KEYSTORE"
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$KEYSTORE
          EOF
      - name: Build Android APKs
        run: bash scripts/build-github-apks
      - name: Verify APKs carry the permanent signing key
        run: python3 tool/ci/verify_apk_signature.py build/app/outputs/apk/github/release/*.apk
      - name: Package and upload Android files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAME: ${{ needs.prepare.outputs.name }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/android/release
          shopt -s nullglob
          apks=(build/app/outputs/apk/github/release/*.apk)
          [ "${#apks[@]}" -gt 0 ] || { echo 'No Android APKs were produced'; exit 1; }
          for apk in "${apks[@]}"; do
            kind=$(basename "$apk" | sed -E 's/.*-((universal|armeabi-v7a|arm64-v8a|x86_64))\.apk$/\1/')
            cp "$apk" "build/android/release/$NAME-android-$kind.apk"
          done
          gh release upload "$TAG" build/android/release/* --clobber
